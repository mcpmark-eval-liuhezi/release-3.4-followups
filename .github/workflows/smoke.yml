name: Smoke Tests

on:
  push

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke checks
        run: |
          test -f STATUS.md
          grep -q "FU-101" STATUS.md
          grep -q "FU-102" STATUS.md
          grep -q "FU-103" STATUS.md
          grep -q "FU-104" STATUS.md
          echo "Smoke checks passed"
